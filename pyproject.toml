[project]
name = "getdiscovrai-rag"
version = "0.1.0"
description = "A localhost hybrid RAG demonstration with local privacy filtering"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.50,<2",
    "openai>=2,<3",
    "python-dotenv>=1.1,<2",
    "numpy>=2,<3",
    "faiss-cpu>=1.12,<2",
    "rank-bm25>=0.2.2,<0.3",
    "markitdown[pdf]>=0.1.3,<0.2",
    "pypdf>=6,<7",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "spacy>=3.8,<3.9",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "tokenizers>=0.22,<1",
    "huggingface-hub>=0.35,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1", "reportlab>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires installed local language assets (no OpenRouter calls)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
